# Card holder front: lotus rising from a pair of wave crests, with two dragonflies above.
# Kamakura-bori inspired; knife-mark ground; double border.

name: Card holder - lotus and dragonflies

product: {type: card_holder, width: 4.25, height: 3.0}

panels:
  main: {ground: knife_marks, border_style: double}

layout:
  - type: single
    origin: [2.125, 0]
    place:
      - {element: lotus, at: [0, 0.34], size: 1.50}
  - type: mirror
    axis: x
    place:
      - {element: nami_crest, at: [0.05, 0.74], rotate: 0, size: 1.30, flip_x: true}
      - {element: tombo, at: [1.12, -0.52], rotate: -28, size: 1.05}
