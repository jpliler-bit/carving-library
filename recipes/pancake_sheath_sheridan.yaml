# Pancake knife sheath (front), Sheridan style: a vine climbing the blade pocket with a rose at the
# top, scalloped leaves, a scroll and a small rose near the tip. Matte ground.
# Product coordinates: x from the left edge, y from the sheath's horizontal centreline (4" down).

name: Pancake sheath - Sheridan rose

product: {type: pancake_sheath, width: 3.6, height: 8.0}

panels:
  main: {ground: matte, border_style: line}

finishes: [natural_antique, saddle_tan, dark_brown]

layout:
  - type: single
    origin: [0, 0]
    stems:
      - points: [[1.30, -2.70], [1.55, -1.85], [1.80, -0.90], [2.05, 0.20], [1.80, 1.20], [1.50, 2.10], [1.70, 2.90]]
        width: 0.11
    place:
      - {element: sheridan_leaf, at: [1.55, -1.75], rotate: -128, size: 1.00, flip_y: true}
      - {element: sheridan_leaf, at: [2.00, -1.65], rotate: -50, size: 0.95}
      - {element: guri_scroll, at: [2.03, 0.12], rotate: 190, size: 1.10, flip_y: true}
      - {element: sheridan_leaf, at: [2.02, 0.15], rotate: 55, size: 1.00}
      - {element: sheridan_leaf, at: [1.85, 0.75], rotate: 140, size: 0.90, flip_y: true}
      - {element: guri_scroll, at: [1.62, 1.75], rotate: 35, size: 0.95}
      - {id: bud, element: rose_bud, at: [0.95, 1.55], rotate: 200, size: 0.45}
      - {element: sheridan_rose, at: [1.80, -0.80], size: 1.50}
      - {element: sheridan_rose, at: [1.72, 2.62], size: 0.90}
    connect:
      - {from: [1.85, 1.10], to: bud.base, start_dir: 150, width: 0.07, end_width: 0.05, line: false}
